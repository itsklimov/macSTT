name: macSTT
options:
  bundleIdPrefix: com.wixfi
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    ENABLE_SPARKLE: NO
    SPARKLE_FEED_URL: ""
    SPARKLE_PUBLIC_ED_KEY: ""

packages:
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.11.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.13.5"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.4.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.1"

targets:
  macSTT:
    type: application
    platform: macOS
    sources:
      - Sources/macSTT
    dependencies:
      - package: swift-log
        product: Logging
      - package: FluidAudio
        product: FluidAudio
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: macSTT uses the microphone to capture audio for local speech-to-text transcription.
        MacSTTEnableSparkle: $(ENABLE_SPARKLE)
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: YES
    entitlements:
      path: Support/macSTT.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.wixfi.stt
        PRODUCT_NAME: macSTT
        MARKETING_VERSION: "0.1.6"
        CURRENT_PROJECT_VERSION: "24"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Manual
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
